name: DevContainer Docker Image- Build and Push

on:
  push:
    tags:
      - '*'
    paths:
      - devcontainers/go-grpc/Dockerfile
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-26.04

    permissions:
      contents: read
      packages: write

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract Git tag
        id: get_tag
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
          # elif [[ $GITHUB_REF == refs/heads/* ]]; then
          #   sanitized_branch=${GITHUB_REF#refs/heads/}
          #   sanitized_branch=${sanitized_branch//\//-}  # Replace / with -
          #   echo "tag=${sanitized_branch}" >> $GITHUB_ENV
          # else
          #   echo "tag=${GITHUB_SHA::7}" >> $GITHUB_ENV
          fi

      - name: Extract short commit hash
        id: get_commit
        run: echo "commit_hash=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Set image name
        run: echo "IMAGE_NAME=dev-go-npm-grpc-java-android" >> $GITHUB_ENV

      - name: Log in to GitHub Packages
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Android Docker image
        id: build_android
        continue-on-error: true
        run: |
          TAG=${{ env.tag || env.commit_hash }}
          IMAGE=ghcr.io/${{ github.repository }}/$IMAGE_NAME:$TAG
          cd devcontainers/go-grpc
          docker build -t $IMAGE .

      - name: Test Android Docker image
        id: test_android
        if: steps.build_android.outcome == 'success'
        continue-on-error: true
        run: |
          TAG=${{ env.tag || env.commit_hash }}
          IMAGE=ghcr.io/${{ github.repository }}/dev-go-npm-grpc-java-android:$TAG
          test_status=0
          docker run --rm \
            --volume "$GITHUB_WORKSPACE/devcontainers/go-grpc/test-image.sh:/tmp/test-image.sh:ro" \
            "$IMAGE" bash /tmp/test-image.sh android || test_status=1
          # Reproduce consumers that run as root and explicitly use current/bin.
          docker run --rm --user root --entrypoint /bin/bash \
            --env HOME=/root \
            --env PATH=/home/dev/.sdkman/candidates/java/current/bin:/home/dev/sw/node-current/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/home/dev/sw/bin:/home/dev/sw/go/bin:/home/dev/go/bin \
            --volume "$GITHUB_WORKSPACE/devcontainers/go-grpc/test-image.sh:/tmp/test-image.sh:ro" \
            "$IMAGE" /tmp/test-image.sh java || test_status=1
          exit "$test_status"

      - name: Set image name
        run: echo "IMAGE_NAME=dev-go-npm-grpc" >> $GITHUB_ENV

      - name: Build core Docker image
        id: build_core
        continue-on-error: true
        run: |
          TAG=${{ env.tag || env.commit_hash }}
          IMAGE=ghcr.io/${{ github.repository }}/$IMAGE_NAME:$TAG
          cd devcontainers/go-grpc
          docker build --target dev-go-npm-grpc -t $IMAGE .

      - name: Test core Docker image
        id: test_core
        if: steps.build_core.outcome == 'success'
        continue-on-error: true
        run: |
          TAG=${{ env.tag || env.commit_hash }}
          IMAGE=ghcr.io/${{ github.repository }}/dev-go-npm-grpc:$TAG
          docker run --rm \
            --volume "$GITHUB_WORKSPACE/devcontainers/go-grpc/test-image.sh:/tmp/test-image.sh:ro" \
            "$IMAGE" bash /tmp/test-image.sh core

      - name: Push tested Docker images
        if: >-
          github.event_name == 'push' &&
          steps.build_android.outcome == 'success' &&
          steps.test_android.outcome == 'success' &&
          steps.build_core.outcome == 'success' &&
          steps.test_core.outcome == 'success'
        run: |
          TAG=${{ env.tag || env.commit_hash }}
          docker push ghcr.io/${{ github.repository }}/dev-go-npm-grpc-java-android:$TAG
          docker push ghcr.io/${{ github.repository }}/dev-go-npm-grpc:$TAG

      - name: Fail if any image build or test failed
        if: always()
        env:
          BUILD_ANDROID_OUTCOME: ${{ steps.build_android.outcome }}
          TEST_ANDROID_OUTCOME: ${{ steps.test_android.outcome }}
          BUILD_CORE_OUTCOME: ${{ steps.build_core.outcome }}
          TEST_CORE_OUTCOME: ${{ steps.test_core.outcome }}
        run: |
          if [[ "$BUILD_ANDROID_OUTCOME" != success || "$TEST_ANDROID_OUTCOME" != success || \
                "$BUILD_CORE_OUTCOME" != success || "$TEST_CORE_OUTCOME" != success ]]; then
            echo "One or more Docker image builds or test suites failed."
            exit 1
          fi

 
